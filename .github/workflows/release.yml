# Runs on version tags: the Go helper's and the Python helper's checks against
# the same golden vectors, then a GitHub release.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  GO_VERSION: '1.27.4'

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.11 cannot read the export data of the Go release above; v2.15 can.
          version: v2.15.0

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 -timeout=5m ./...

      - name: Test coverage
        run: |
          go test -coverprofile=coverage.out -timeout=5m ./...
          go tool cover -func=coverage.out | tail -1

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Each supported Python runs in its official image, which keeps versions the
  # runner's own Python installer no longer offers, 3.9 among them.
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@v4
      - name: unittest
        working-directory: python/tests
        env:
          PYTHONPATH: ..
        run: python -m unittest
      - name: pip install from the path
        run: |
          python -m pip install ./python
          python -c "import filekind; print(len(filekind.registry()))"

  # A release needs a tag; a run dispatched on a branch checks the code only.
  release:
    needs: [go, python]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
